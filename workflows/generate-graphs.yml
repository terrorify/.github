name: Generate Structural Knowledge Graphs

on:
  # Manual On-Command Trigger
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build mode (full or incremental)'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - incremental
      export_artifacts:
        description: 'Upload graph artifacts'
        required: false
        default: true
        type: boolean

  # Push trigger on codebase changes
  push:
    branches: [main, master]
    paths:
      - 'authority/**'
      - 'gamesense/**'
      - 'stomzy/**'
      - 'internode/**'
      - 'cruisers2/**'
      - 'spacetime/**'
      - 'dashvue/**'
      - 'typeshi/**'
      - 'vault/**'
      - 'website/**'
      - 'eco/**'
      - 'servers/**'
      - 'libs/**'
      - '.bible/**'
      - 'CLAUDE.md'
      - 'NETWORK_TOPOLOGY_MAP.md'

  # Webhook / satellite trigger
  repository_dispatch:
    types: [generate-graphs, sync-docs]

  # Nightly graph refresh
  schedule:
    - cron: '0 2 * * *'

jobs:
  build-and-index-graphs:
    name: Build Knowledge Graph & AST Index
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ORGANIZATION_PAT || github.token }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate Knowledge Graph & Visualizer
        env:
          BUILD_MODE: ${{ github.event.inputs.mode || 'full' }}
        run: |
          if [ "$BUILD_MODE" = "incremental" ]; then
            node .bible/scripts/generate-graphs.mjs --incremental --ci
          else
            node .bible/scripts/generate-graphs.mjs --ci
          fi

      - name: Run Graph Verification Suite
        run: |
          node .bible/scripts/graph-cli.mjs verify

      - name: Run End-to-End Lifecycle Verification Trace
        run: |
          node .bible/scripts/graph-cli.mjs trace-lifecycle

      - name: Upload Graph Artifacts
        if: ${{ github.event.inputs.export_artifacts != false }}
        uses: actions/upload-artifact@v4
        with:
          name: structural-knowledge-graphs
          path: |
            .bible/graph.db
            .bible/graphs/
          retention-days: 14

      - name: Commit & Push Updated Graph Definitions
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "Terrorify Architecture Bot"
          git config user.email "arch-bot@terrorify.net"
          git add .bible/graph.db .bible/graphs/ NETWORK_TOPOLOGY_MAP.md CLAUDE.md
          
          if ! git diff --staged --quiet; then
            git commit -m "chore(graph): update structural knowledge graph & AST database [skip ci]"
            git push origin main
          else
            echo "No structural graph changes to commit."
          fi
